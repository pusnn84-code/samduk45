name: Prepare samji PDF dependency
on: [push]
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cp package-lock.json /tmp/samji-base-lock.json
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Export dependency metadata
        run: |
          node --input-type=module -e "import fs from 'node:fs';const b=JSON.parse(fs.readFileSync('/tmp/samji-base-lock.json'));const n=JSON.parse(fs.readFileSync('package-lock.json'));const d=Object.fromEntries(Object.entries(n.packages).filter(([k,v])=>JSON.stringify(v)!==JSON.stringify(b.packages[k])));console.log('SAMJI_LOCK_START'+JSON.stringify(d)+'SAMJI_LOCK_END');"
